services:
  db:
    # PostgreSQL is the project's local database.
    image: postgres:16-alpine
    container_name: api-docker-db
    restart: unless-stopped
    # These values can be overridden through a .env file.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_docker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Makes PostgreSQL available at localhost:5432 on the host machine.
    ports:
      - "5432:5432"
    # Keeps the data when the container is stopped or recreated.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Checks that PostgreSQL is ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-api_docker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # FastAPI application container.
    build: .
    container_name: api-docker-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-api_docker}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]

volumes:
  # Docker-managed volume for PostgreSQL data.
  postgres_data: